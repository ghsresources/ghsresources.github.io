<!DOCTYPE html>
<html>
    <head>
        <title>Secret Website</title>
        <link rel="stylesheet" href="style.css">
        <style>
            .pTitle {
                background-color: navy;
            }
            h1 {
                text-align: left;
                font-family: 'Roboto_Legacy_Bold', system-ui;
                font-size: 36px;
            }
        </style>
    </head>
    <body>
        <div class="pTitle">
            <br><h1>Secret Webpage</h1><br>
        </div>

        <p>Please enter the secret password.</p>
        <label for="pwd">Password: </label>
        <input type="password" id="pwd" name="pwd"><br><br>
        <div class="center">
            <button id="submit">Submit</button>
        </div>

        <dialog id="denied">
            <h2>Access Denied</h2>
            <p>The password you entered is incorrect!</p>

            <form method="dialog">
                <div class="center">
                <a href="index.html"><button style="border: 4px solid white;">Close</button></a>
                </div>
            </form>
        </dialog>

        <dialog id="failed">
            <h2>Notice</h2>
            <p>Inspect element and page source has been disabled.</p>

            <form method="dialog">
                <div class="center">
                <a href="index.html"><button style="border: 4px solid white;">Close</button></a>
                </div>
            </form>
        </dialog>

        <script>
            const submitBtn = document.getElementById("submit");
            const dialog = document.getElementById("denied");
            const failedDialog = document.getElementById("failed");
            submitBtn.addEventListener("click", () => {
                const pwdEntry = document.getElementById("pwd").value;
                if (pwdEntry == "flintnsteel") { window.open("mcl_202609012170403.exe", "_blank"); }
                else if (pwdEntry == "chickenjockey") { window.open("ec_20260914141408.html", "_blank"); }
                else if (pwdEntry == "riseoverrun") { window.open("frame_embed/inner-frame-minified.html", "_blank"); }
                else { dialog.showModal(); }
            });

            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && (e.key == 'u' || e.key == 'U' || e.shiftKey)) {
                    e.preventDefault();
                    failedDialog.showModal();
                }
            });

            document.addEventListener('contextmenu', function(event) {
                event.preventDefault();
                failedDialog.showModal();
            });

            document.addEventListener('keydown', function(e) {
                if (e.shiftKey) {
                    document.addEventListener('mousedown', (event) => {
                        if (event.button == 2) {
                            event.preventDefault();
                        }
                    });
                }
            });
        </script>
    </body>
</html>
